{% extends "base.html" %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-icon">🔐</div>
        <h1 class="auth-title">Entrar</h1>
        <p class="auth-sub">Acesse sua conta para continuar</p>

        <form method="POST">

            <label class="tf-label">E-mail</label>
            <input type="email" name="email" class="tf-input"
                placeholder="seu@email.com" required>

            <label class="tf-label">Senha</label>
            <input type="password" name="password" class="tf-input"
                placeholder="••••••••" required>

            <button type="submit" class="tf-btn-primary">Entrar</button>

        </form>

        <div class="auth-footer">
            Não tem conta?
            <a href="{{ url_for('main.register') }}">Cadastre-se</a>
        </div>

    </div>
</div>

{% endblock %}
