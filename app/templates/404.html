{% extends "base.html" %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-icon">
      <i class="ti ti-file-search"></i>
    </div>
    <h1 class="error-title">Página não encontrada</h1>
    <p class="error-sub">O endereço que você acessou não existe ou foi removido.</p>
    <div class="error-actions">
      <a href="{{ url_for('main.dashboard') }}" class="tf-btn-primary">
        <i class="ti ti-home"></i> Ir para o dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
