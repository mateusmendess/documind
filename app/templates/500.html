{% extends "base.html" %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-code">500</div>
    <div class="error-icon">
      <i class="ti ti-alert-triangle"></i>
    </div>
    <h1 class="error-title">Erro interno do servidor</h1>
    <p class="error-sub">Algo deu errado no servidor. Tente novamente em alguns instantes.</p>
    <div class="error-actions">
      <a href="{{ url_for('main.dashboard') }}" class="tf-btn-primary">
        <i class="ti ti-home"></i> Ir para o dashboard
      </a>
      <a href="javascript:history.back()" class="btn-error-back">
        <i class="ti ti-arrow-left"></i> Voltar
      </a>
    </div>
  </div>
</div>
{% endblock %}
