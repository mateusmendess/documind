{% extends "base.html" %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-icon">📝</div>
        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-sub">Preencha os dados abaixo para começar</p>

        <form method="POST">

            <label class="tf-label">Nome</label>
            <input type="text" name="name" class="tf-input"
                placeholder="Seu nome completo" required>

            <label class="tf-label">E-mail</label>
            <input type="email" name="email" class="tf-input"
                placeholder="seu@email.com" required>

            <label class="tf-label">Senha</label>
            <input type="password" name="password" class="tf-input"
                placeholder="••••••••" required>

            <button type="submit" class="tf-btn-primary">Cadastrar</button>

        </form>

        <div class="auth-footer">
            Já tem conta?
            <a href="{{ url_for('main.login') }}">Fazer login</a>
        </div>

    </div>
</div>

{% endblock %}
