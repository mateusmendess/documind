{% extends "base.html" %}

{% block content %}
<div class="chat-container">
  
  <div class="chat-header">
  <i class="ti ti-file-text"></i>
  <span class="chat-filename">{{ doc.filename }}</span>
  <span class="chat-badge">Pronto</span>

  <form method="POST" action="{{ url_for('main.clear_chat', doc_id=doc.id) }}" style="margin-left: auto;">
    <button type="submit" class="btn-clear-chat" title="Limpar conversa">
      <i class="ti ti-trash"></i> Nova conversa
    </button>
  </form>
</div>

  <div class="chat-messages" id="chatMessages">
    {% if not history %}
    <div class="chat-empty">
      <i class="ti ti-message-question"></i>
      <p>Faça uma pergunta sobre o documento</p>
    </div>
    {% endif %}

    {% for msg in history %}
    <div class="chat-bubble user-bubble">
      <p>{{ msg.question }}</p>
    </div>
    <div class="chat-bubble-wrapper">
      <div class="chat-avatar">
        <i class="ti ti-robot"></i>
      </div>
      <div class="chat-bubble ai-bubble">
        <p>{{ msg.answer }}</p>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="chat-input-area">
    <form method="POST">
      <input type="text" name="question" placeholder="Digite sua pergunta..." autocomplete="off" required />
      <button type="submit"><i class="ti ti-send"></i></button>
    </form>
  </div>

</div>

<script>
  // Scroll automático para o final das mensagens
  const chatMessages = document.getElementById("chatMessages");
  chatMessages.scrollTop = chatMessages.scrollHeight;
</script>
{% endblock %}
